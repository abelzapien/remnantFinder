name: Release Portable Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine Version
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $ver = "1.0.0"
          }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Self-Contained Portable Package
        shell: pwsh
        run: |
          ./build-release.ps1 -Version "$env:VERSION"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remnant2-BuildLootOverseer-v${{ env.VERSION }}-win-x64
          path: release/*.zip

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
